<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="500" rx="22" fill="#f7f6f5"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#1d1d1f">From thousands of AI tools to a few Co-Pilot modules</text>
  <text x="32" y="68" font-size="13" fill="#5b6770">Bain careers blog (21 Aug 2025) and Bain press release (25 Aug 2026), read 26 Oct 2026</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a96a0"/></marker>
  </defs>
  <!-- inputs -->
  <g font-size="14" fill="#1d1d1f">
    <rect x="32" y="92" width="336" height="70" rx="14" fill="#ffffff" stroke="#d9d4d0"/>
    <text x="52" y="121" font-weight="700">19,000+ custom GPTs</text>
    <text x="52" y="143" font-size="12.5" fill="#5b6770">built by Bain teams, by August 2025</text>
    <rect x="392" y="92" width="336" height="70" rx="14" fill="#ffffff" stroke="#d9d4d0"/>
    <text x="412" y="121" font-weight="700">Claude for all 19,000 people</text>
    <text x="412" y="143" font-size="12.5" fill="#5b6770">announced August 2026, incl. Claude Code</text>
  </g>
  <path d="M200 164 V184 H380 V200" fill="none" stroke="#8a96a0" stroke-width="2"/>
  <path d="M560 164 V184 H380" fill="none" stroke="#8a96a0" stroke-width="2"/>
  <line x1="380" y1="196" x2="380" y2="206" stroke="#8a96a0" stroke-width="2" marker-end="url(#a)"/>
  <!-- the question -->
  <rect x="132" y="210" width="496" height="50" rx="25" fill="#cc0000"/>
  <text x="380" y="241" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Which ideas deserve to become a Co-Pilot module?</text>
  <line x1="380" y1="262" x2="380" y2="284" stroke="#8a96a0" stroke-width="2" marker-end="url(#a)"/>
  <!-- three gates -->
  <g font-size="13" fill="#3e4a52">
    <rect x="32" y="290" width="216" height="118" rx="16" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
    <text x="50" y="318" font-size="15" font-weight="700" fill="#1d1d1f">1 · Used</text>
    <text x="50" y="342">beyond the team that</text>
    <text x="50" y="360">built it, and used again</text>
    <rect x="50" y="372" width="184" height="24" rx="12" fill="#fbe5e5"/>
    <text x="62" y="389" font-size="12" font-weight="600" fill="#9a0000">Usage dashboards see this</text>

    <rect x="272" y="290" width="216" height="118" rx="16" fill="#ffffff" stroke="#c4ccd2" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="290" y="318" font-size="15" font-weight="700" fill="#1d1d1f">2 · Trusted</text>
    <text x="290" y="342">passes a test set of past</text>
    <text x="290" y="360">cases; blind expert scoring</text>
    <rect x="290" y="372" width="150" height="24" rx="12" fill="#eef1f3"/>
    <text x="302" y="389" font-size="12" font-weight="600" fill="#4b5862">Needs its own measure</text>

    <rect x="512" y="290" width="216" height="118" rx="16" fill="#ffffff" stroke="#c4ccd2" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="530" y="318" font-size="15" font-weight="700" fill="#1d1d1f">3 · Changed the work</text>
    <text x="530" y="342">faster first answer; output</text>
    <text x="530" y="360">survives into the client doc</text>
    <rect x="530" y="372" width="150" height="24" rx="12" fill="#eef1f3"/>
    <text x="542" y="389" font-size="12" font-weight="600" fill="#4b5862">Needs its own measure</text>
  </g>
  <line x1="250" y1="349" x2="268" y2="349" stroke="#8a96a0" stroke-width="2" marker-end="url(#a)"/>
  <line x1="490" y1="349" x2="508" y2="349" stroke="#8a96a0" stroke-width="2" marker-end="url(#a)"/>
  <text x="32" y="442" font-size="13" font-weight="700" fill="#1d1d1f">The method and its test set belong to the practice.</text>
  <text x="32" y="462" font-size="13" fill="#3e4a52">The Claude skill, GPT or Sage feature is the wrapper, so a platform change means rerunning tests, not rebuilding.</text>
  <text x="32" y="486" font-size="12" fill="#6b7780">Built from public sources only. I haven't seen the Full Potential Co-Pilot.</text>
</svg>
