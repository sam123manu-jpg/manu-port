<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="600" fill="#ffffff"/>
<text x="24" y="36" font-size="16" font-weight="700" fill="#16181d">Checkout.com Legal · the front door, as your postings and legal centre describe it</text>
<text x="24" y="56" font-size="12" fill="#5b6270">Read 29 Oct 2026. Outside read: the friction below is a guess that discovery checks first.</text>
<text x="24" y="92" font-size="13" font-weight="700" fill="#16181d">Today: requests from the business arrive through legal intake</text>
<g font-size="12" fill="#16181d" text-anchor="middle">
<rect x="24" y="106" width="167" height="62" rx="10" fill="#f1f3f7" stroke="#3b4a6b"/>
<text x="107" y="130" font-weight="700" fill="#3b4a6b">MERCHANT</text><text x="107" y="150">agreements</text>
<rect x="205" y="106" width="167" height="62" rx="10" fill="#f1f3f7" stroke="#3b4a6b"/>
<text x="288" y="130" font-weight="700" fill="#3b4a6b">VENDOR</text><text x="288" y="150">contracts</text>
<rect x="386" y="106" width="167" height="62" rx="10" fill="#f1f3f7" stroke="#3b4a6b"/>
<text x="469" y="130" font-weight="700" fill="#3b4a6b">NDAs</text><text x="469" y="150">low-risk paper</text>
<rect x="567" y="106" width="169" height="62" rx="10" fill="#f1f3f7" stroke="#3b4a6b"/>
<text x="651" y="130" font-weight="700" fill="#3b4a6b">WHICH TERMS?</text><text x="651" y="150">11 country terms</text>
</g>
<rect x="24" y="180" width="712" height="36" rx="8" fill="#16181d"/>
<text x="380" y="203" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Legal intake in Jira Service Management · knowledge in Confluence</text>
<rect x="24" y="226" width="712" height="62" rx="8" fill="#fdecea"/>
<text x="380" y="250" font-size="13" font-weight="700" fill="#a3332b" text-anchor="middle">To check: facts missing, so the first reply is a question · the same question answered again</text>
<text x="380" y="272" font-size="13" font-weight="700" fill="#a3332b" text-anchor="middle">· low-risk work waiting in the same queue as complex work</text>
<line x1="380" y1="296" x2="380" y2="318" stroke="#16181d" stroke-width="2"/><polygon points="374,318 380,328 386,318" fill="#16181d"/>
<text x="24" y="352" font-size="13" font-weight="700" fill="#16181d">Proposed, after discovery ranks the pipeline: three steps, each piloted with one team</text>
<g font-size="12" fill="#16181d">
<rect x="24" y="366" width="230" height="104" rx="10" fill="#e8f1ff" stroke="#2f6fd6"/>
<text x="40" y="390" font-weight="700" fill="#2f6fd6">1 SMARTER FRONT DOOR</text>
<text x="40" y="412">• form asks what the lawyer needs</text><text x="40" y="431">• AI drafts summary, suggests queue</text><text x="40" y="450">• a person routes it</text>
<rect x="265" y="366" width="230" height="104" rx="10" fill="#e8f1ff" stroke="#2f6fd6"/>
<text x="281" y="390" font-weight="700" fill="#2f6fd6">2 ANSWERS WITH SOURCES</text>
<text x="281" y="412">• from approved Confluence pages</text><text x="281" y="431">• every answer cites its page</text><text x="281" y="450">• nothing covers it → a ticket</text>
<rect x="506" y="366" width="230" height="104" rx="10" fill="#e8f1ff" stroke="#2f6fd6"/>
<text x="522" y="390" font-weight="700" fill="#2f6fd6">3 STANDARD-PAPER LANE</text>
<text x="522" y="412">• checked against the lawyer's</text><text x="522" y="431">  own playbook, deviations flagged</text><text x="522" y="450">• a lawyer signs off</text>
</g>
<line x1="380" y1="478" x2="380" y2="496" stroke="#16181d" stroke-width="2"/><polygon points="374,496 380,506 386,496" fill="#16181d"/>
<rect x="24" y="510" width="712" height="72" rx="10" fill="#16181d"/>
<text x="40" y="536" font-size="13" font-weight="700" fill="#ffffff">CONTROLS FIRST, TESTS ALWAYS</text>
<text x="40" y="557" font-size="12" fill="#d8dde8">Vendors reviewed with InfoSec, Data Protection, Procurement · answers inherit source permissions · privileged</text>
<text x="40" y="574" font-size="12" fill="#d8dde8">matters kept out · a lawyer-checked test set from real requests runs before every change ships</text>
</svg>
