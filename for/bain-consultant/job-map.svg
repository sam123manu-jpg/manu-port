<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><clipPath id="r"><rect width="760" height="500" rx="18"/></clipPath></defs>
<g clip-path="url(#r)"><rect width="760" height="500" fill="#0f0f10"/><rect width="760" height="6" fill="#CC0000"/></g>
<text x="40" y="64" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="28">The Consultant's job, three moves</text>
<text x="40" y="92" fill="#a8a8ad" font-size="14">From Bain's role description, with my evidence for each</text>
<rect x="40" y="120" width="213" height="330" rx="12" fill="#1b1b1d" stroke="#2c2c30"/>
<text x="58" y="160" fill="#CC0000" font-family="Georgia, 'Times New Roman', serif" font-size="26">01</text>
<text x="58" y="192" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="19">Research the client</text>
<rect x="58" y="206" width="36" height="3" fill="#CC0000"/>
<circle cx="62" cy="239.5" r="3" fill="#CC0000"/>
<text x="72" y="244" fill="#e6e6e8" font-size="13">Spoke to players: 80% of</text>
<text x="72" y="264" fill="#e6e6e8" font-size="13">depositors used Paytm, so</text>
<text x="72" y="284" fill="#e6e6e8" font-size="13">we switched the gateway</text>
<circle cx="62" cy="343.5" r="3" fill="#CC0000"/>
<text x="72" y="348" fill="#e6e6e8" font-size="13">Sovena: 59 teas reviewed</text>
<text x="72" y="368" fill="#e6e6e8" font-size="13">with surveys, social listening</text>
<text x="72" y="388" fill="#e6e6e8" font-size="13">and market research</text>
<path d="M259.0 280 l6 5 l-6 5" fill="none" stroke="#CC0000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="273" y="120" width="213" height="330" rx="12" fill="#1b1b1d" stroke="#2c2c30"/>
<text x="291" y="160" fill="#CC0000" font-family="Georgia, 'Times New Roman', serif" font-size="26">02</text>
<text x="291" y="192" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="19">Find the answer</text>
<rect x="291" y="206" width="36" height="3" fill="#CC0000"/>
<circle cx="295" cy="239.5" r="3" fill="#CC0000"/>
<text x="305" y="244" fill="#e6e6e8" font-size="13">Read churn as loss aversion;</text>
<text x="305" y="264" fill="#e6e6e8" font-size="13">a second-chance game lifted</text>
<text x="305" y="284" fill="#e6e6e8" font-size="13">new-user retention 30%</text>
<circle cx="295" cy="343.5" r="3" fill="#CC0000"/>
<text x="305" y="348" fill="#e6e6e8" font-size="13">Recommended repositioning</text>
<text x="305" y="368" fill="#e6e6e8" font-size="13">the teas around occasions,</text>
<text x="305" y="388" fill="#e6e6e8" font-size="13">presented to the director</text>
<path d="M492.0 280 l6 5 l-6 5" fill="none" stroke="#CC0000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="506" y="120" width="213" height="330" rx="12" fill="#1b1b1d" stroke="#2c2c30"/>
<text x="524" y="160" fill="#CC0000" font-family="Georgia, 'Times New Roman', serif" font-size="26">03</text>
<text x="524" y="192" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="19">Move to action</text>
<rect x="524" y="206" width="36" height="3" fill="#CC0000"/>
<circle cx="528" cy="239.5" r="3" fill="#CC0000"/>
<text x="538" y="244" fill="#e6e6e8" font-size="13">Moved clients onto a</text>
<text x="538" y="264" fill="#e6e6e8" font-size="13">self-serve ad exchange:</text>
<text x="538" y="284" fill="#e6e6e8" font-size="13">$100k a month in ad spend</text>
<circle cx="528" cy="343.5" r="3" fill="#CC0000"/>
<text x="538" y="348" fill="#e6e6e8" font-size="13">Brought developers and</text>
<text x="538" y="368" fill="#e6e6e8" font-size="13">marketing to one direction</text>
<text x="538" y="388" fill="#e6e6e8" font-size="13">on a GMNG redesign</text>
<text x="40" y="478" fill="#8a8a90" font-size="12">Sources: Bain Consultant role description (jobid 10409); my work at GMNG, XY ADS and Sovena.</text>
</svg>