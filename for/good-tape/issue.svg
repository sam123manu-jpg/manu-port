<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="520" fill="#ffffff"/>
<text x="24" y="36" font-size="16" font-weight="700" fill="#1b1530">Good Tape · how the free offer is described (public pages, Lisbon, 24 Oct 2026)</text>
<text x="24" y="76" font-size="13" font-weight="700" fill="#1b1530">What a visitor reads, depending on the page</text>
<rect x="24" y="92" width="712" height="62" rx="10" fill="#f5efff" stroke="#7b2ff2"/>
<text x="40" y="116" font-size="12" font-weight="700" fill="#7b2ff2">PRICING CARD</text>
<text x="40" y="138" font-size="14" fill="#1b1530">“Free Trial €0 · 1 hour of transcription”   (no number of days)</text>
<rect x="24" y="164" width="712" height="62" rx="10" fill="#f5efff" stroke="#7b2ff2"/>
<text x="40" y="188" font-size="12" font-weight="700" fill="#7b2ff2">PRICING FAQ, SAME PAGE</text>
<text x="40" y="210" font-size="14" fill="#1b1530">“You can sign up to a 3-day Free Trial”</text>
<rect x="24" y="236" width="712" height="80" rx="10" fill="#f5efff" stroke="#7b2ff2"/>
<text x="40" y="260" font-size="12" font-weight="700" fill="#7b2ff2">MAIN FAQ</text>
<text x="40" y="282" font-size="14" fill="#1b1530">Free plan: “three transcripts per month, each up to 30 minutes”</text>
<text x="40" y="303" font-size="13" fill="#5b5470">Its “See our free plan details →” link opens a page about the one-hour trial, with no days.</text>
<text x="24" y="356" font-size="13" font-weight="700" fill="#1b1530">The journey a new user actually takes</text>
<rect x="24" y="372" width="150" height="70" rx="10" fill="#ffffff" stroke="#1b1530"/>
<text x="99" y="404" font-size="14" font-weight="700" fill="#1b1530" text-anchor="middle">Sign up</text>
<text x="99" y="424" font-size="12" fill="#5b5470" text-anchor="middle">no card</text>
<line x1="174" y1="407" x2="214" y2="407" stroke="#1b1530" stroke-width="2"/><polygon points="214,401 224,407 214,413" fill="#1b1530"/>
<rect x="226" y="372" width="230" height="70" rx="10" fill="#7b2ff2"/>
<text x="341" y="402" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Trial: 1 hour of Pro</text>
<text x="341" y="424" font-size="13" fill="#ffffff" text-anchor="middle">for 3 days</text>
<line x1="456" y1="407" x2="496" y2="407" stroke="#1b1530" stroke-width="2"/><polygon points="496,401 506,407 496,413" fill="#1b1530"/>
<rect x="508" y="372" width="228" height="70" rx="10" fill="#e7d6ff" stroke="#7b2ff2"/>
<text x="622" y="402" font-size="14" font-weight="700" fill="#1b1530" text-anchor="middle">Free plan</text>
<text x="622" y="424" font-size="13" fill="#1b1530" text-anchor="middle">3 × 30-min transcripts a month</text>
<text x="622" y="456" font-size="11" fill="#5b5470" text-anchor="middle">help centre: “once the trial ends”</text>
<rect x="24" y="462" width="712" height="38" rx="8" fill="#fff6d6"/>
<text x="380" y="486" font-size="13" font-weight="700" fill="#1b1530" text-anchor="middle">No single page shows this whole journey before someone signs up.</text>
</svg>
