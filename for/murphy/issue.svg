<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="600" fill="#ffffff"/>
<text x="24" y="36" font-size="16" font-weight="700" fill="#16181d">Murphy · onboarding a new bank, as the posting and website describe it</text>
<text x="24" y="56" font-size="12" fill="#5b6270">Read 29 Oct 2026. Outside read: the split of the weeks across the five is what step one measures.</text>
<text x="24" y="92" font-size="13" font-weight="700" fill="#16181d">Today: five decisions, each set by engineers, for every bank</text>
<g font-size="12" fill="#16181d" text-anchor="middle">
<rect x="24" y="106" width="134" height="76" rx="10" fill="#f1f3f7" stroke="#3b4a6b"/>
<text x="91" y="130" font-weight="700" fill="#3b4a6b">1 DATA</text><text x="91" y="150">file, schedule or</text><text x="91" y="168">dialer + CRM</text>
<rect x="168" y="106" width="134" height="76" rx="10" fill="#f1f3f7" stroke="#3b4a6b"/>
<text x="235" y="130" font-weight="700" fill="#3b4a6b">2 MARKET RULES</text><text x="235" y="150">openings, hours,</text><text x="235" y="168">recording (14 markets)</text>
<rect x="312" y="106" width="134" height="76" rx="10" fill="#f1f3f7" stroke="#3b4a6b"/>
<text x="379" y="130" font-weight="700" fill="#3b4a6b">3 LIMITS</text><text x="379" y="150">e.g. discount ≤20%,</text><text x="379" y="168">1st payment ≤14 days</text>
<rect x="456" y="106" width="134" height="76" rx="10" fill="#f1f3f7" stroke="#3b4a6b"/>
<text x="523" y="130" font-weight="700" fill="#3b4a6b">4 CONTACT PLAN</text><text x="523" y="150">e.g. calls ≥4h apart,</text><text x="523" y="168">max 2 a day</text>
<rect x="600" y="106" width="136" height="76" rx="10" fill="#f1f3f7" stroke="#3b4a6b"/>
<text x="668" y="130" font-weight="700" fill="#3b4a6b">5 APPROVAL</text><text x="668" y="150">only compliance</text><text x="668" y="168">managers approve</text>
</g>
<rect x="24" y="196" width="712" height="44" rx="8" fill="#fdecea"/>
<text x="380" y="223" font-size="13" font-weight="700" fill="#a3332b" text-anchor="middle">“Weeks of manual configuration by engineers” before the first live call, and a ticket for every later change</text>
<line x1="380" y1="252" x2="380" y2="280" stroke="#16181d" stroke-width="2"/><polygon points="374,280 380,290 386,280" fill="#16181d"/>
<text x="24" y="318" font-size="13" font-weight="700" fill="#16181d">Proposed: build what repeats once, let the bank set its own values</text>
<g font-size="12" fill="#16181d">
<rect x="24" y="332" width="230" height="100" rx="10" fill="#e8f1ff" stroke="#2f6fd6"/>
<text x="40" y="356" font-weight="700" fill="#2f6fd6">REUSED ACROSS BANKS</text>
<text x="40" y="378">• a rule pack per market (2)</text><text x="40" y="397">• starting values per debt stage (3, 4)</text><text x="40" y="416">• conflict check before launch</text>
<rect x="265" y="332" width="230" height="100" rx="10" fill="#e8f1ff" stroke="#2f6fd6"/>
<text x="281" y="356" font-weight="700" fill="#2f6fd6">SET BY THE BANK</text>
<text x="281" y="378">• its limits and contact plan</text><text x="281" y="397">• its compliance manager approves</text><text x="281" y="416">  in the product, versioned (5)</text>
<rect x="506" y="332" width="230" height="100" rx="10" fill="#e8f1ff" stroke="#2f6fd6"/>
<text x="522" y="356" font-weight="700" fill="#2f6fd6">KEPT BY ENGINEERS</text>
<text x="522" y="378">• the data connection (1)</text><text x="522" y="397">• new integrations, new markets</text><text x="522" y="416">• product gaps → product requests</text>
</g>
<line x1="380" y1="440" x2="380" y2="464" stroke="#16181d" stroke-width="2"/><polygon points="374,464 380,474 386,464" fill="#16181d"/>
<rect x="24" y="478" width="712" height="96" rx="10" fill="#16181d"/>
<text x="40" y="504" font-size="13" font-weight="700" fill="#ffffff">ONE GATE BEFORE A BANK HEARS ANYTHING: every new setup and every agent change</text>
<text x="40" y="528" font-size="12" fill="#d8dde8">Offline: replay test calls per market and debt stage (disputes, vulnerable customers, wrong numbers),</text>
<text x="40" y="546" font-size="12" fill="#d8dde8">scored by the existing compliance checks. A compliance fail never ships. Live: a holdout on share of</text>
<text x="40" y="564" font-size="12" fill="#d8dde8">balance collected, promises kept and cost per euro collected; complaints and escalations as guardrails.</text>
</svg>
