<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="600" fill="#fdfcf8"/>
<text x="24" y="36" font-size="16" font-weight="700" fill="#151514">Cortea · how a finding can fail, as the website and postings describe the product</text>
<text x="24" y="56" font-size="12" fill="#5b5a58">Read 6 Nov 2026. Outside read: how often each happens is what the first weeks measure.</text>
<g font-size="12" fill="#151514" text-anchor="middle">
<rect x="24" y="76" width="200" height="66" rx="10" fill="#f1f0ed" stroke="#151514"/>
<text x="124" y="100" font-weight="700">AUDIT FILE</text><text x="124" y="118">report, statements, notes,</text><text x="124" y="134">working papers</text>
<rect x="280" y="76" width="200" height="66" rx="10" fill="#e3f8e3" stroke="#193c24"/>
<text x="380" y="100" font-weight="700" fill="#193c24">QUALITY AGENTS</text><text x="380" y="118">cross-check figures,</text><text x="380" y="134">disclosures, sources</text>
<rect x="536" y="76" width="200" height="66" rx="10" fill="#f1f0ed" stroke="#151514"/>
<text x="636" y="100" font-weight="700">REVIEWER</text><text x="636" y="118">accept, override, comment,</text><text x="636" y="134">then partner sign-off</text>
</g>
<line x1="226" y1="109" x2="270" y2="109" stroke="#151514" stroke-width="2"/><polygon points="270,103 280,109 270,115" fill="#151514"/>
<line x1="482" y1="109" x2="526" y2="109" stroke="#151514" stroke-width="2"/><polygon points="526,103 536,109 526,115" fill="#151514"/>
<text x="24" y="182" font-size="13" font-weight="700" fill="#151514">Two ways a quality layer fails</text>
<g font-size="12" fill="#151514">
<rect x="24" y="196" width="350" height="112" rx="10" fill="#ffffff" stroke="#151514"/>
<text x="40" y="220" font-weight="700">NOISE: too much flagged that turns out fine</text>
<text x="40" y="242">Reviewers learn to click Accept: the over-reliance</text>
<text x="40" y="260">your Berlin auditor posting warns about.</text>
<text x="40" y="288" font-weight="700" fill="#193c24">Visible: every override is on the record.</text>
<rect x="386" y="196" width="350" height="112" rx="10" fill="#151514"/>
<text x="402" y="220" font-weight="700" fill="#fdfcf8">SILENCE: an inconsistency nobody flagged</text>
<text x="402" y="242" fill="#cfceca">Looks exactly like a clean file, until a reviewer,</text>
<text x="402" y="260" fill="#cfceca">a regulator or Companies House finds it.</text>
<text x="402" y="288" font-weight="700" fill="#c6fb50">Invisible: nothing in the product shows a miss.</text>
</g>
<line x1="380" y1="318" x2="380" y2="342" stroke="#151514" stroke-width="2"/><polygon points="374,342 380,352 386,342" fill="#151514"/>
<text x="24" y="376" font-size="13" font-weight="700" fill="#151514">Proposed: one answer per check (how often it's right, what it misses, whether reviewers still look)</text>
<g font-size="12" fill="#151514">
<rect x="24" y="390" width="230" height="90" rx="10" fill="#e3f8e3" stroke="#193c24"/>
<text x="40" y="414" font-weight="700" fill="#193c24">1 · REVIEW</text>
<text x="40" y="436">overrides + reasons per check;</text><text x="40" y="454">weekly visits to reviewers</text>
<rect x="265" y="390" width="230" height="90" rx="10" fill="#e3f8e3" stroke="#193c24"/>
<text x="281" y="414" font-weight="700" fill="#193c24">2 · RECHECK</text>
<text x="281" y="436">a fix reruns its check and the</text><text x="281" y="454">checks that depend on it</text>
<rect x="506" y="390" width="230" height="90" rx="10" fill="#e3f8e3" stroke="#193c24"/>
<text x="522" y="414" font-weight="700" fill="#193c24">CLEAN ≠ SILENT</text>
<text x="522" y="436">a clean check says what it</text><text x="522" y="454">covered and what it didn't</text>
</g>
<line x1="380" y1="488" x2="380" y2="508" stroke="#151514" stroke-width="2"/><polygon points="374,508 380,518 386,508" fill="#151514"/>
<rect x="24" y="522" width="712" height="66" rx="10" fill="#193c24"/>
<rect x="24" y="522" width="8" height="66" rx="4" fill="#c6fb50"/>
<text x="44" y="546" font-size="13" font-weight="700" fill="#fdfcf8">3 · TEST GATE: every model, prompt or check change, run before and after</text>
<text x="44" y="566" font-size="12" fill="#e3f8e3">Public filed accounts + seeded errors + methodology cases. A change that loses a known catch doesn't ship.</text>
<text x="44" y="582" font-size="12" fill="#e3f8e3">Misses counted by blind review of a sample of signed-off files, with pilot firms' agreement.</text>
</svg>
