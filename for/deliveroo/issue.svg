<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="700" fill="#ffffff"/>
  <text x="24" y="36" font-size="17" font-weight="700" fill="#2e3333">Deliveroo · what the homepage asks first, and what I'd build</text>
  <text x="24" y="58" font-size="12.5" fill="#585c5c">Web homepage, logged out, Soho and Croydon, Sun 8 Nov 2026, 3:30pm and 4:17pm. The signed-in app may differ.</text>

  <text x="24" y="94" font-size="13" font-weight="700" fill="#2e3333">Today: a strip of 95 shortcuts, about 16 on a laptop screen (3:30pm)</text>
  <g font-size="10.5" fill="#2e3333" text-anchor="middle">
    <g transform="translate(24,108)">
      <rect width="80" height="56" rx="10" fill="#e6faf8" stroke="#00ccbc"/><circle cx="40" cy="22" r="11" fill="#00ccbc"/><text x="40" y="48">Supermarket</text>
      <rect x="88" width="80" height="56" rx="10" fill="#e6faf8" stroke="#00ccbc"/><circle cx="128" cy="22" r="11" fill="#00ccbc"/><text x="128" y="48">Burgers</text>
      <rect x="176" width="80" height="56" rx="10" fill="#e6faf8" stroke="#00ccbc"/><circle cx="216" cy="22" r="11" fill="#00ccbc"/><text x="216" y="48">All offers</text>
      <rect x="264" width="80" height="56" rx="10" fill="#e6faf8" stroke="#00ccbc"/><circle cx="304" cy="22" r="11" fill="#00ccbc"/><text x="304" y="48">Reservations</text>
      <rect x="352" width="80" height="56" rx="10" fill="#e6faf8" stroke="#00ccbc"/><circle cx="392" cy="22" r="11" fill="#00ccbc"/><text x="392" y="48">Cold and flu</text>
      <rect x="440" width="80" height="56" rx="10" fill="#e6faf8" stroke="#00ccbc"/><circle cx="480" cy="22" r="11" fill="#00ccbc"/><text x="480" y="48">Breakfast</text>
      <text x="568" y="30" font-size="12" fill="#585c5c">… 89 more,</text><text x="568" y="45" font-size="12" fill="#585c5c">including</text>
      <rect x="616" width="96" height="56" rx="10" fill="#fff4e5" stroke="#e8a33d"/><text x="664" y="22" font-weight="700">Desserts ×3</text><text x="664" y="38">one name,</text><text x="664" y="51">3 different pages</text>
    </g>
  </g>
  <g font-size="12" fill="#2e3333">
    <rect x="24" y="178" width="226" height="64" rx="12" fill="#f5f6f6" stroke="#d6d9d9"/>
    <text x="38" y="200" font-weight="700">FOLLOWS THE CLOCK, NOT PLACE</text>
    <text x="38" y="218">first 90 tiles same in both areas;</text>
    <text x="38" y="234">4:17pm: Pizza, Chinese up</text>
    <rect x="266" y="178" width="226" height="64" rx="12" fill="#f5f6f6" stroke="#d6d9d9"/>
    <text x="280" y="200" font-weight="700">11 DEAL AND OFFER TILES (SOHO)</text>
    <text x="280" y="218">incl. "Top deals" and "Top Deals!",</text>
    <text x="280" y="234">Daily, Menu, Dish, Meal deals</text>
    <rect x="508" y="178" width="228" height="64" rx="12" fill="#e6faf8" stroke="#00ccbc"/>
    <text x="522" y="200" font-weight="700" fill="#01857c">CAROUSELS FOLLOW PLACE</text>
    <text x="522" y="218">Croydon: Great value for money,</text>
    <text x="522" y="234">Offers near you · Soho: Top picks</text>
  </g>

  <text x="24" y="276" font-size="13" font-weight="700" fill="#2e3333">The question underneath: on this visit, what is this customer here for?</text>
  <g font-size="11.5" fill="#01857c" font-weight="600" text-anchor="middle">
    <rect x="24" y="288" width="134" height="30" rx="15" fill="#ffffff" stroke="#00ccbc"/><text x="91" y="307">Dinner tonight</text>
    <rect x="168" y="288" width="134" height="30" rx="15" fill="#ffffff" stroke="#00ccbc"/><text x="235" y="307">Top-up shop</text>
    <rect x="312" y="288" width="134" height="30" rx="15" fill="#ffffff" stroke="#00ccbc"/><text x="379" y="307">Lunch at work</text>
    <rect x="456" y="288" width="134" height="30" rx="15" fill="#ffffff" stroke="#00ccbc"/><text x="523" y="307">Something for a cold</text>
    <rect x="600" y="288" width="136" height="30" rx="15" fill="#ffffff" stroke="#00ccbc"/><text x="668" y="307">A gift</text>
  </g>

  <line x1="380" y1="330" x2="380" y2="356" stroke="#2e3333" stroke-width="2"/>
  <path d="M374 352 L380 362 L386 352 Z" fill="#2e3333"/>

  <text x="24" y="390" font-size="13" font-weight="700" fill="#2e3333">Proposed: read the visit, then five motions</text>
  <rect x="24" y="402" width="712" height="52" rx="12" fill="#2e3333"/>
  <text x="40" y="424" font-size="12" font-weight="700" fill="#00ccbc">SIGNALS PER VISIT</text>
  <text x="40" y="443" font-size="12" fill="#ffffff">customer's past orders · time and day · area · verticals they use · market and language</text>

  <g font-size="11.5" fill="#2e3333" text-anchor="middle">
    <rect x="24" y="466" width="134" height="80" rx="12" fill="#ffffff" stroke="#2e3333"/>
    <text x="91" y="488" font-weight="700">RANK THE STRIP</text><text x="91" y="506">per customer</text><text x="91" y="522">and moment</text>
    <rect x="168" y="466" width="134" height="80" rx="12" fill="#ffffff" stroke="#2e3333"/>
    <text x="235" y="488" font-weight="700">ONE NAME,</text><text x="235" y="503" font-weight="700">ONE PLACE</text><text x="235" y="521">merge look-alikes;</text><text x="235" y="536">dietary from merchants</text>
    <rect x="312" y="466" width="134" height="80" rx="12" fill="#ffffff" stroke="#2e3333"/>
    <text x="379" y="488" font-weight="700">RESTAURANT</text><text x="379" y="503" font-weight="700">TO SHOP</text><text x="379" y="521">top-up window,</text><text x="379" y="536">Bundles, at the moment</text>
    <rect x="456" y="466" width="134" height="80" rx="12" fill="#ffffff" stroke="#2e3333"/>
    <text x="523" y="488" font-weight="700">GLOBAL, LOCAL</text><text x="523" y="506">GenAI carousels in</text><text x="523" y="521">each language and</text><text x="523" y="536">rhythm (e.g. Ramadan)</text>
    <rect x="600" y="466" width="136" height="80" rx="12" fill="#ffffff" stroke="#2e3333"/>
    <text x="668" y="488" font-weight="700">RELEVANT</text><text x="668" y="503" font-weight="700">TO SHOW</text><text x="668" y="521">every slot, whoever</text><text x="668" y="536">wants it</text>
  </g>

  <rect x="24" y="562" width="712" height="114" rx="12" fill="#e6faf8"/>
  <text x="40" y="588" font-size="13" font-weight="700" fill="#01857c">MEASURED ON ORDERS FROM HOMEPAGE VISITS, BY MARKET AND BRAND</text>
  <text x="40" y="610" font-size="12" fill="#2e3333">Leading: time to first add-to-cart, visits that end without an order. Every change against a holdout,</text>
  <text x="40" y="628" font-size="12" fill="#2e3333">sample size agreed with data science first. Guardrails: order mix across verticals, new restaurants'</text>
  <text x="40" y="646" font-size="12" fill="#2e3333">first orders, refunds and complaints, basket value. Monthly talks with customers who opened and left.</text>
  <text x="40" y="666" font-size="10.5" fill="#585c5c">Sources: deliveroo.co.uk, 8 Nov 2026 · DoorDash Engineering, Dec 2025 · DoorDash RecSys 2025 · DoorDash Q3 2026 call</text>
</svg>
