<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="640" fill="#ffffff"/>
<text x="24" y="36" font-size="16" font-weight="700" fill="#16181d">One AI product, from discovery to the P&amp;L</text>
<text x="24" y="56" font-size="12" fill="#5b6270">Steps from the posting. Figures: Oliver Wyman Forum, The Reality Check (Oct 2026).</text>
<rect x="24" y="72" width="712" height="46" rx="8" fill="#fdecea"/>
<text x="380" y="92" font-size="13" font-weight="700" fill="#a3332b" text-anchor="middle">Only 8% of workplace AI users say their company has a standard</text>
<text x="380" y="110" font-size="13" font-weight="700" fill="#a3332b" text-anchor="middle">for what happens to the time AI saves. 54%: each person decides, or nobody does.</text>
<g font-size="12" fill="#16181d" text-anchor="middle">
<rect x="24" y="140" width="110" height="70" rx="10" fill="#e8f1ff" stroke="#2f6fd6" stroke-width="2"/>
<text x="79" y="162" font-weight="700" fill="#2f6fd6">1 DISCOVER</text><text x="79" y="180">map steps,</text><text x="79" y="196">exceptions</text>
<rect x="144" y="140" width="110" height="70" rx="10" fill="#f1f3f7" stroke="#3b4a6b"/>
<text x="199" y="162" font-weight="700" fill="#3b4a6b">2 DESIGN</text><text x="199" y="180">rules, agent</text><text x="199" y="196">or person</text>
<rect x="264" y="140" width="110" height="70" rx="10" fill="#f1f3f7" stroke="#3b4a6b"/>
<text x="319" y="162" font-weight="700" fill="#3b4a6b">3 PROTOTYPE</text><text x="319" y="180">built myself,</text><text x="319" y="196">synthetic data</text>
<rect x="384" y="140" width="110" height="70" rx="10" fill="#f1f3f7" stroke="#3b4a6b"/>
<text x="439" y="162" font-weight="700" fill="#3b4a6b">4 ACCEPTANCE</text><text x="439" y="180">test set from</text><text x="439" y="196">past cases</text>
<rect x="504" y="140" width="110" height="70" rx="10" fill="#e8f1ff" stroke="#2f6fd6" stroke-width="2"/>
<text x="559" y="162" font-weight="700" fill="#2f6fd6">5 GO-LIVE</text><text x="559" y="180">adoption,</text><text x="559" y="196">handover</text>
<rect x="624" y="140" width="112" height="70" rx="10" fill="#16181d"/>
<text x="680" y="162" font-weight="700" fill="#ffffff">6 VALUE</text><text x="680" y="180" fill="#ffffff">same measures,</text><text x="680" y="196" fill="#ffffff">after go-live</text>
</g>
<g fill="#16181d"><polygon points="135,170 143,175 135,180"/><polygon points="255,170 263,175 255,180"/><polygon points="375,170 383,175 375,180"/><polygon points="495,170 503,175 495,180"/><polygon points="615,170 623,175 615,180"/></g>
<g font-size="12" fill="#16181d">
<line x1="79" y1="212" x2="79" y2="236" stroke="#2f6fd6" stroke-width="2"/>
<rect x="24" y="236" width="300" height="56" rx="8" fill="#ffffff" stroke="#2f6fd6" stroke-width="2" stroke-dasharray="5 4"/>
<text x="38" y="258" font-weight="700" fill="#2f6fd6">MOVED TO THE START · decision 1</text>
<text x="38" y="278">Baseline measured before anything is built</text>
<line x1="559" y1="212" x2="559" y2="236" stroke="#2f6fd6" stroke-width="2"/>
<rect x="400" y="236" width="336" height="56" rx="8" fill="#ffffff" stroke="#2f6fd6" stroke-width="2" stroke-dasharray="5 4"/>
<text x="414" y="258" font-weight="700" fill="#2f6fd6">BEFORE GO-LIVE · decision 2</text>
<text x="414" y="278">What the saved time becomes, agreed with the sponsor</text>
</g>
<text x="24" y="336" font-size="13" font-weight="700" fill="#16181d">Worked example: a bank's KYC review, sorted step by step</text>
<g font-size="12" fill="#16181d">
<rect x="24" y="350" width="230" height="150" rx="10" fill="#f1f3f7" stroke="#3b4a6b"/>
<text x="40" y="374" font-weight="700" fill="#3b4a6b">RULES · simple automation</text>
<text x="40" y="398">• format checks</text><text x="40" y="418">• expiry dates</text><text x="40" y="438">• duplicate checks</text><text x="40" y="468" fill="#5b6270">No agent needed</text>
<rect x="265" y="350" width="230" height="150" rx="10" fill="#e8f1ff" stroke="#2f6fd6" stroke-width="2"/>
<text x="281" y="374" font-weight="700" fill="#2f6fd6">AGENT · messy input</text>
<text x="281" y="398">• reads documents that</text><text x="281" y="416">  don't match the form</text><text x="281" y="436">• requests what's missing</text><text x="281" y="454">  in approved wording</text><text x="281" y="474">• drafts the summary, sourced</text>
<rect x="506" y="350" width="230" height="150" rx="10" fill="#16181d"/>
<text x="522" y="374" font-weight="700" fill="#ffffff">PERSON · every decision</text>
<text x="522" y="398" fill="#ffffff">• reviewer approves or</text><text x="522" y="416" fill="#ffffff">  rejects every case</text><text x="522" y="436" fill="#ffffff">• high risk goes straight</text><text x="522" y="454" fill="#ffffff">  to a senior reviewer</text><text x="522" y="474" fill="#ffffff">• can take a case back</text>
</g>
<rect x="24" y="516" width="712" height="100" rx="10" fill="#f7f8fa" stroke="#c9ced8"/>
<g font-size="12" fill="#16181d">
<text x="40" y="540" font-weight="700">GUARDRAILS IN THE DESIGN</text>
<text x="40" y="562">• Access: read-only on customer records, writes only to the case file</text>
<text x="40" y="582">• Failure: a failed check or unreadable document stops the agent and returns the case to the queue</text>
<text x="40" y="602">• Cost: each paid provider check runs once per case, its data reused across steps</text>
</g>
</svg>
