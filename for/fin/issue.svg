<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="640" fill="#ffffff"/>
<text x="24" y="36" font-size="16" font-weight="700" fill="#111111">Fin · how a paid self-serve account grows, from the pricing page and help centre</text>
<text x="24" y="56" font-size="12" fill="#5f5e5a">Read 6 Nov 2026. Outside read: how many accounts sit at each cap is what step one counts.</text>
<text x="24" y="92" font-size="13" font-weight="700" fill="#111111">Three ways to grow after the first payment</text>
<g font-size="12" fill="#111111" text-anchor="middle">
<rect x="24" y="106" width="226" height="84" rx="12" fill="#f1eee9" stroke="#313130"/>
<text x="137" y="130" font-weight="700">1 FIN SEES MORE</text><text x="137" y="150">live on more segments</text><text x="137" y="168">and channels</text>
<rect x="267" y="106" width="226" height="84" rx="12" fill="#f1eee9" stroke="#313130"/>
<text x="380" y="130" font-weight="700">2 FIN RESOLVES MORE</text><text x="380" y="150">$0.99 per outcome, nothing if</text><text x="380" y="168">it can't answer or hands over</text>
<rect x="510" y="106" width="226" height="84" rx="12" fill="#f1eee9" stroke="#313130"/>
<text x="623" y="130" font-weight="700">3 ACCOUNT ADDS MORE</text><text x="623" y="150">seats, add-ons (Pro, Copilot)</text><text x="623" y="168">and new products</text>
</g>
<g font-size="12" text-anchor="middle">
<rect x="24" y="202" width="226" height="74" rx="10" fill="#fff1e8" stroke="#ff5600"/>
<text x="137" y="224" font-weight="700" fill="#c44200">CAP: STAGED ROLLOUT</text><text x="137" y="243" fill="#111111">team first, then one segment;</text><text x="137" y="261" fill="#111111">can stay there</text>
<rect x="267" y="202" width="226" height="74" rx="10" fill="#fff1e8" stroke="#ff5600"/>
<text x="380" y="224" font-weight="700" fill="#c44200">CAP: SPENDING LIMIT</text><text x="380" y="243" fill="#111111">hard limit hit: Fin turns off,</text><text x="380" y="261" fill="#111111">new chats go to handover</text>
<rect x="510" y="202" width="226" height="74" rx="10" fill="#f6f5f3" stroke="#aeaca8"/>
<text x="623" y="224" font-weight="700" fill="#5f5e5a">TIMING: AFTER THE TRIAL</text><text x="623" y="243" fill="#111111">every trial includes all add-ons;</text><text x="623" y="261" fill="#111111">month one decides what stays</text>
</g>
<line x1="380" y1="290" x2="380" y2="314" stroke="#111111" stroke-width="2"/><polygon points="374,314 380,324 386,314" fill="#111111"/>
<text x="24" y="352" font-size="13" font-weight="700" fill="#111111">Proposed: a weekly signal per account, and a motion for each signal</text>
<rect x="24" y="364" width="712" height="52" rx="10" fill="#111111"/>
<text x="40" y="386" font-size="12" font-weight="700" fill="#ffffff">SIGNAL LAYER</text>
<text x="40" y="404" font-size="12" fill="#d3cec6">share of conversations Fin is live on · resolution trend · headroom under the limit · add-ons dropped</text>
<g font-size="12" fill="#111111" text-anchor="middle">
<rect x="24" y="428" width="134" height="76" rx="10" fill="#faf9f6" stroke="#313130"/>
<text x="91" y="452" font-weight="700">WIDEN</text><text x="91" y="472">next segment or</text><text x="91" y="490">channel, simulated</text>
<rect x="168" y="428" width="134" height="76" rx="10" fill="#faf9f6" stroke="#313130"/>
<text x="235" y="452" font-weight="700">SECOND CHANCE</text><text x="235" y="472">early miss shown</text><text x="235" y="490">with its fix, re-test</text>
<rect x="312" y="428" width="134" height="76" rx="10" fill="#faf9f6" stroke="#313130"/>
<text x="379" y="452" font-weight="700">HEADROOM</text><text x="379" y="472">what Fin resolved,</text><text x="379" y="490">before the cap</text>
<rect x="456" y="428" width="134" height="76" rx="10" fill="#faf9f6" stroke="#313130"/>
<text x="523" y="452" font-weight="700">TRY AGAIN</text><text x="523" y="472">new products tried</text><text x="523" y="490">on own conversations</text>
<rect x="600" y="428" width="136" height="76" rx="10" fill="#faf9f6" stroke="#313130"/>
<text x="668" y="452" font-weight="700">HANDOVER</text><text x="668" y="472">to sales and back,</text><text x="668" y="490">by agreed rules</text>
</g>
<rect x="24" y="520" width="712" height="96" rx="10" fill="#fff1e8"/>
<text x="40" y="546" font-size="13" font-weight="700" fill="#c44200">MEASURED ON THE BOOK'S NET GROWTH, WITH QUALITY AS THE GUARDRAIL</text>
<text x="40" y="570" font-size="12" fill="#111111">Split monthly: more outcomes, seats and plans, add-ons and new products, against contraction and churn,</text>
<text x="40" y="588" font-size="12" fill="#111111">by first-paid month. Every motion against a holdout. Reopens (refunded as outcomes), satisfaction and</text>
<text x="40" y="606" font-size="12" fill="#111111">requests for a person stop a motion, whatever it does to revenue.</text>
</svg>
