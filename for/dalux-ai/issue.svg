<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="500" rx="22" fill="#f5f8f9"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#1d1d1f">AI Safety hints, as Dalux documents them</text>
  <text x="32" y="68" font-size="13" fill="#5b6770">Dalux help centre: AI Safety hints article and Build 2026.5 notes, read 24 Oct 2026</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a96a0"/></marker>
  </defs>
  <!-- top row -->
  <g font-size="14" fill="#1d1d1f">
    <rect x="32" y="92" width="200" height="66" rx="14" fill="#ffffff" stroke="#d5dde2"/>
    <text x="50" y="120" font-weight="700">SiteWalk recorded</text>
    <text x="50" y="142" font-size="12.5" fill="#5b6770">360° walk of the site</text>
    <rect x="280" y="92" width="200" height="66" rx="14" fill="#ffffff" stroke="#d5dde2"/>
    <text x="298" y="120" font-weight="700">AI flags a scene</text>
    <text x="298" y="142" font-size="12.5" fill="#5b6770">and explains why</text>
    <rect x="528" y="92" width="200" height="66" rx="14" fill="#ffffff" stroke="#d5dde2"/>
    <circle cx="710" cy="108" r="5" fill="#e5484d"/>
    <text x="546" y="120" font-weight="700">Safety manager</text>
    <text x="546" y="142" font-size="12.5" fill="#5b6770">reviews the hint</text>
  </g>
  <line x1="234" y1="125" x2="276" y2="125" stroke="#8a96a0" stroke-width="2" marker-end="url(#a)"/>
  <line x1="482" y1="125" x2="524" y2="125" stroke="#8a96a0" stroke-width="2" marker-end="url(#a)"/>
  <!-- branches -->
  <path d="M628 160 V186 H200 V212" fill="none" stroke="#8a96a0" stroke-width="2" marker-end="url(#a)"/>
  <path d="M628 160 V212" fill="none" stroke="#8a96a0" stroke-width="2" marker-end="url(#a)"/>
  <!-- left: create issue -->
  <rect x="32" y="216" width="336" height="150" rx="16" fill="#ffffff" stroke="#8dc63f" stroke-width="2"/>
  <text x="52" y="246" font-size="15" font-weight="700" fill="#1d1d1f">Create safety issue</text>
  <text x="52" y="270" font-size="13" fill="#3e4a52">Title, description and a cropped screenshot</text>
  <text x="52" y="288" font-size="13" fill="#3e4a52">are pre-filled; a person sets severity and</text>
  <text x="52" y="306" font-size="13" fill="#3e4a52">category. The hint links to the issue.</text>
  <rect x="52" y="322" width="176" height="28" rx="14" fill="#eaf5dc"/>
  <text x="66" y="341" font-size="13" font-weight="600" fill="#3d6b12">Dalux learns: useful hint</text>
  <!-- right: no action -->
  <rect x="392" y="216" width="336" height="150" rx="16" fill="#ffffff" stroke="#c4ccd2" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="412" y="246" font-size="15" font-weight="700" fill="#1d1d1f">Closed, or no action</text>
  <text x="412" y="270" font-size="13" fill="#3e4a52">Close asks for no reason. With no</text>
  <text x="412" y="288" font-size="13" fill="#3e4a52">action, the hint is removed after 30</text>
  <text x="412" y="306" font-size="13" fill="#3e4a52">days, opened or not.</text>
  <rect x="412" y="322" width="198" height="28" rx="14" fill="#eef1f3"/>
  <text x="426" y="341" font-size="13" font-weight="600" fill="#4b5862">Dalux can't tell which case</text>
  <!-- the three meanings -->
  <g font-size="13" fill="#1d1d1f">
    <rect x="392" y="384" width="104" height="44" rx="12" fill="#ffffff" stroke="#d5dde2"/>
    <text x="444" y="411" text-anchor="middle">AI was wrong</text>
    <rect x="508" y="384" width="104" height="44" rx="12" fill="#ffffff" stroke="#d5dde2"/>
    <text x="560" y="403" text-anchor="middle">Already</text>
    <text x="560" y="419" text-anchor="middle">handled</text>
    <rect x="624" y="384" width="104" height="44" rx="12" fill="#ffffff" stroke="#d5dde2"/>
    <text x="676" y="403" text-anchor="middle">Nobody had</text>
    <text x="676" y="419" text-anchor="middle">time to look</text>
  </g>
  <line x1="560" y1="368" x2="560" y2="380" stroke="#8a96a0" stroke-width="2"/>
  <text x="32" y="400" font-size="13" font-weight="700" fill="#1d1d1f">Each needs a different fix:</text>
  <text x="32" y="420" font-size="13" fill="#3e4a52">the model, de-duplication, or alert volume.</text>
  <text x="32" y="440" font-size="13" fill="#3e4a52">Today all three look the same.</text>
  <text x="32" y="476" font-size="12" fill="#6b7780">Documented design, not observed use. The product may log more than the help centre shows.</text>
</svg>
